<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRID // WORD — Word Guess</title>
<style>
  :root{
    --bg: #f3f5fb;
    --panel: #ffffff;
    --line: #e2e5f0;
    --line-strong: #cfd3e4;
    --cyan: #2f6bff;
    --magenta: #2f6bff;
    --amber: #2f6bff;
    --text: #1f2333;
    --text-dim: #7d8199;
    --correct: #2fae63;
    --present: #d6a92c;
    --absent: #c3c7d6;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', 'Consolas', monospace;
    -webkit-tap-highlight-color: transparent;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 24px 16px;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(47,107,255,0.07), transparent 60%),
      radial-gradient(ellipse at 100% 110%, rgba(47,107,255,0.06), transparent 60%),
      var(--bg);
  }

  .cabinet{
    width: min(980px, 94vw);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 28px;
    position: relative;
    box-shadow: 0 10px 30px rgba(31,35,51,0.06);
  }

  .layout{
    display: flex;
    flex-direction: column;
  }

  .main-col{ min-width: 0; }
  .side-col{ min-width: 0; }

  @media (min-width: 820px){
    .layout{
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 36px;
      align-items: start;
    }
    .board{ max-width: 340px; }
    .tile{ font-size: clamp(20px, 2.4vw, 28px); }
    .key{ height: 50px; font-size: 13px; }
    .history{ margin-top: 0; border-top: none; padding-top: 0; }
    .history-list{ max-height: 460px; }
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .back-link{
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    text-decoration: none;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .back-link:hover{ color: var(--cyan); }

  .brand{
    font-family: 'Press Start 2P', 'Courier New', monospace;
    font-size: 14px;
    letter-spacing: 2px;
    line-height: 1.6;
  }
  .brand .grid{ color: var(--cyan); }
  .brand .slash{ color: var(--text-dim); }
  .brand .word{ color: var(--magenta); }

  .tag{
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  .stat-row{
    display:flex;
    justify-content: space-between;
    margin-bottom: 16px;
    font-size: 11px;
    letter-spacing: 1px;
  }
  .stat{ display:flex; flex-direction:column; align-items:center; gap:4px; flex:1; }
  .stat-label{ color: var(--text-dim); font-size: 9px; }
  .stat-value{ font-weight: bold; font-size: 15px; color: var(--amber); }

  .message{
    text-align:center;
    font-size: 11px;
    letter-spacing: 0.5px;
    color: var(--amber);
    min-height: 16px;
    margin-bottom: 8px;
  }

  .stage{ position: relative; }

  .board{
    display: grid;
    grid-template-rows: repeat(6, 1fr);
    gap: 6px;
    margin: 0 auto 20px;
    max-width: 300px;
  }

  .board-row{
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .tile{
    aspect-ratio: 1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: clamp(18px, 5vw, 24px);
    font-weight: bold;
    border: 2px solid var(--line-strong);
    border-radius: 6px;
    background: #ffffff;
    color: var(--text);
    text-transform: uppercase;
    transition: transform 0.15s ease;
  }
  .tile.filled{ border-color: var(--text-dim); }
  .tile.shake{ animation: shake 0.4s ease; }
  .tile.pop{ animation: pop 0.12s ease; }

  .tile.correct{ background: var(--correct); border-color: var(--correct); color: #ffffff; }
  .tile.present{ background: var(--present); border-color: var(--present); color: #2b2200; }
  .tile.absent{ background: var(--absent); border-color: var(--absent); color: #6b6f82; }

  .tile.reveal{
    animation: flip 0.5s ease forwards;
  }

  @keyframes flip{
    0%   { transform: rotateX(0deg); }
    50%  { transform: rotateX(90deg); }
    100% { transform: rotateX(0deg); }
  }
  @keyframes shake{
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }
  @keyframes pop{
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  .keyboard{
    display:flex;
    flex-direction:column;
    gap: 6px;
  }
  .key-row{
    display:flex;
    justify-content:center;
    gap: 5px;
  }
  .key{
    flex: 1;
    max-width: 34px;
    min-width: 22px;
    height: 44px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: #eef0f8;
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
    user-select: none;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .key:hover{ border-color: var(--cyan); background: #e5ebff; }
  .key.wide{ max-width: 52px; font-size: 10px; }
  .key.correct{ background: var(--correct); border-color: var(--correct); color: #ffffff; }
  .key.present{ background: var(--present); border-color: var(--present); color: #2b2200; }
  .key.absent{ background: #d7dae4; border-color: #d7dae4; color: #8b8fa3; }

  .overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 14px;
    background: rgba(255,255,255,0.94);
    text-align:center;
    padding: 20px;
    border-radius: 10px;
  }
  .overlay.hidden{ display:none; }

  .overlay h1{
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(14px, 4.5vw, 18px);
    margin: 0;
  }
  .overlay h1.win{ color: var(--correct); }
  .overlay h1.lose{ color: #e5484d; }

  .overlay p{ margin:0; font-size: 12px; color: var(--text-dim); }
  .overlay .answer-word{
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    letter-spacing: 3px;
    color: var(--amber);
  }

  .btn{
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    padding: 12px 20px;
    background: var(--amber);
    color: #ffffff;
    border: 1px solid var(--amber);
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: filter 0.15s ease;
  }
  .btn:hover{ filter: brightness(1.08); }
  .btn:focus-visible{ outline: 2px solid var(--cyan); outline-offset: 3px; }

  footer{
    margin-top: 16px;
    display:flex;
    justify-content: space-between;
    align-items:center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .hint{ font-size: 11px; color: var(--text-dim); letter-spacing: 0.5px; }
  .reset-link{
    background:none; border:none; color: var(--text-dim);
    font-family: 'Courier New', monospace; font-size: 11px;
    text-decoration: underline; cursor: pointer; letter-spacing: 0.5px; padding: 0;
  }
  .reset-link:hover{ color: var(--text); }

  .history{
    margin-top: 18px;
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }
  .history-head{
    display:flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px; margin-bottom: 8px;
  }
  .history-title{ font-size: 11px; letter-spacing: 1px; color: var(--text-dim); }
  .player-badge{ font-size: 11px; color: var(--text-dim); }
  .player-badge b{ color: var(--text); }
  .history-list{
    list-style:none; margin:0; padding:0;
    display:flex; flex-direction:column; gap: 6px;
    max-height: 150px; overflow-y: auto;
  }
  .history-row{
    display:flex; flex-direction: column; align-items: stretch; gap: 3px;
    font-size: 11px; padding: 7px 9px;
    background: #f6f7fb; border: 1px solid var(--line); border-left: 3px solid transparent; border-radius: 4px;
    animation: row-in 0.25s ease;
  }
  .history-row-main{ display:flex; justify-content: space-between; gap: 8px; }
  .history-row.win{ border-color: var(--correct); }
  .history-row.rank-2{ background: #f0f1f7; }
  .history-row.rank-3{ background: #f8f2ea; }
  .history-row.mine{ border-left-color: var(--cyan); }
  .history-row.mine .history-time{ color: var(--cyan); font-weight: bold; }
  .history-row.pinned{ border-left-width: 4px; box-shadow: 0 1px 4px rgba(31,35,51,0.06); }
  .history-time{ color: var(--text-dim); }
  .history-word{ color: var(--text); letter-spacing: 1px; }
  .history-result{ font-weight:bold; }
  .history-row.win .history-result{ color: var(--correct); }
  .history-row.lose .history-result{ color: var(--magenta); }
  .history-when{ font-size: 10px; color: var(--text-dim); text-align: right; letter-spacing: 0.3px; }
  .history-empty{ font-size: 11px; color: var(--text-dim); padding: 8px 2px; }
  .pinned-slot:not(:empty){ margin-bottom: 8px; }
  .pinned-label{ font-size: 9px; letter-spacing: 1px; color: var(--text-dim); margin: 0 0 4px 2px; text-transform: uppercase; }
  .history-row.skeleton{
    height: 34px; border: 1px solid var(--line);
    background: linear-gradient(90deg, #eef0f7 25%, #f7f8fc 37%, #eef0f7 63%);
    background-size: 400% 100%; animation: skeleton-pulse 1.4s ease infinite;
  }
  .show-more-btn{
    display:block; margin: 8px auto 0; background:none;
    border: 1px dashed var(--line-strong); color: var(--text-dim);
    font-family: inherit; font-size: 10px; letter-spacing: 1px;
    padding: 6px 14px; border-radius: 4px; cursor: pointer;
  }
  .show-more-btn:hover{ color: var(--text); border-color: var(--cyan); }
  .show-more-btn[hidden]{ display:none; }
  @keyframes row-in{ from{ opacity:0; transform: translateY(-3px); } to{ opacity:1; transform:none; } }
  @keyframes skeleton-pulse{ 0%{ background-position: 200% 0; } 100%{ background-position: -200% 0; } }

  @media (prefers-reduced-motion: reduce){
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<div class="cabinet">
  <header>
    <div>
      <a class="back-link" href="index.html">← MENU</a>
      <div class="brand"><span class="grid">GRID</span><span class="slash"> // </span><span class="word">WORD</span></div>
    </div>
    <div class="tag">guess the word</div>
  </header>

  <div class="layout">
    <div class="main-col">
      <div class="stat-row">
        <div class="stat"><span class="stat-label">TIME</span><span class="stat-value" id="liveTime">0:00</span></div>
        <div class="stat"><span class="stat-label">PLAYED</span><span class="stat-value" id="played">0</span></div>
        <div class="stat"><span class="stat-label">WIN %</span><span class="stat-value" id="winPct">0</span></div>
        <div class="stat"><span class="stat-label">STREAK</span><span class="stat-value" id="streak">0</span></div>
        <div class="stat"><span class="stat-label">MAX</span><span class="stat-value" id="maxStreak">0</span></div>
      </div>

      <div class="message" id="message"></div>

      <div class="stage">
        <div class="board" id="board"></div>

        <div class="keyboard" id="keyboard"></div>

        <div class="overlay hidden" id="endOverlay">
          <h1 id="endTitle">YOU WIN</h1>
          <p id="endSub">Solved in 0 guesses.</p>
          <p class="answer-word" id="answerWord"></p>
          <button class="btn" id="nextBtn">PLAY AGAIN</button>
        </div>
      </div>

      <footer>
        <div class="hint">Type or tap letters, Enter to submit.</div>
        <button class="reset-link" id="resetBtn">Restart</button>
      </footer>
    </div>

    <div class="side-col">
      <div class="history">
        <div class="history-head">
          <span class="history-title">TOP GAMES</span>
          <span class="player-badge">Playing as <b id="playerNameDisplay">—</b> · <button class="reset-link" id="changeNameBtn">change</button></span>
        </div>
        <div class="pinned-slot" id="pinnedSlot"></div>
        <ul class="history-list" id="historyList"></ul>
        <button class="show-more-btn" id="showMoreBtn" hidden></button>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>

  // --- shared leaderboard (Firestore) ---
  // Scores post to a shared collection everyone reads from, so the
  // leaderboard updates live across every visitor's browser. See
  // firestore.rules: writes are create-only (no edit/delete), so there's
  // no "clear history" here anymore — it's an append-only shared board.

  function formatRelativeTime(iso){
    const then = new Date(iso).getTime();
    if(Number.isNaN(then)) return '';
    const diffSec = Math.max(0, Math.floor((Date.now() - then) / 1000));
    if(diffSec < 5) return 'just now';
    if(diffSec < 60) return diffSec + 's ago';
    const diffMin = Math.floor(diffSec / 60);
    if(diffMin < 60) return diffMin + 'm ago';
    const diffHr = Math.floor(diffMin / 60);
    if(diffHr < 24) return diffHr + 'h ago';
    const diffDay = Math.floor(diffHr / 24);
    if(diffDay < 7) return diffDay + 'd ago';
    return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  function refreshRelativeTimes(){
    historyList.querySelectorAll('[data-at]').forEach(el => { el.textContent = formatRelativeTime(el.dataset.at); });
    pinnedSlot.querySelectorAll('[data-at]').forEach(el => { el.textContent = formatRelativeTime(el.dataset.at); });
  }

  function renderSkeleton(){
    historyList.innerHTML = Array.from({ length: 4 }).map(() => '<li class="history-row skeleton"></li>').join('');
  }

  function rankBadge(i){
    return i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : ('#' + (i + 1));
  }

  function rankClass(i){
    return i === 1 ? ' rank-2' : i === 2 ? ' rank-3' : '';
  }

  function attachLeaderboardListener(){
    renderSkeleton();
    db.collection(COLLECTION)
      .orderBy('at', 'desc')
      .limit(200)
      .onSnapshot(snapshot => {
        history = snapshot.docs.map(doc => ({ _id: doc.id, ...doc.data() }));
        renderHistory();
        renderStats();
      }, err => {
        console.error('Leaderboard sync error:', err);
        historyRenderKey = '';
        historyList.innerHTML = '<li class="history-empty">Couldn\'t reach the leaderboard — check firebase-config.js.</li>';
      });
    if(!relativeTimeHandle) relativeTimeHandle = setInterval(refreshRelativeTimes, 30000);
  }

  showMoreBtn.addEventListener('click', () => {
    showAllRows = !showAllRows;
    historyRenderKey = '';
    renderHistory();
  });

  async function postScore(entry){
    try{
      await db.collection(COLLECTION).add({ ...entry, player: playerName });
    } catch(err){
      console.error('Failed to post score:', err);
    }
  }

  function formatTimestamp(iso){
    const d = new Date(iso);
    return d.toLocaleString(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
  }

  function formatDuration(ms){
    const totalSec = Math.floor(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  function startTimer(){
    stopTimer();
    roundStartTime = Date.now();
    elapsedMs = 0;
    liveTimeEl.textContent = '0:00';
    timerHandle = setInterval(() => {
      elapsedMs = Date.now() - roundStartTime;
      liveTimeEl.textContent = formatDuration(elapsedMs);
    }, 250);
  }

  function stopTimer(){
    if(timerHandle) clearInterval(timerHandle);
    timerHandle = null;
  }

    const wins = mine.filter(h => h.result === 'win').length;
    playedEl.textContent = played;
    winPctEl.textContent = played === 0 ? 0 : Math.round((wins / played) * 100);

    let streak = 0;
    for(const h of mine){
      if(h.result === 'win') streak++;
      else break;
    }
    let maxStreak = 0, run = 0;
    for(let i = mine.length - 1; i >= 0; i--){
      if(mine[i].result === 'win'){ run++; maxStreak = Math.max(maxStreak, run); }
      else run = 0;
    }
    streakEl.textContent = streak;
    maxStreakEl.textContent = maxStreak;
  }

  function renderHistory(){
    if(history.length === 0){
      pinnedSlot.innerHTML = '';
      showMoreBtn.hidden = true;
      historyRenderKey = 'empty';
      historyList.innerHTML = '<li class="history-empty">No games yet — finish a round to log one.</li>';
      return;
    }
    // Rank best-to-worst: wins first ordered by fewest guesses, losses
    // last, faster time breaks ties. Sorts a copy — the underlying
    // history array stays as delivered by Firestore.
    const score = h => h.result === 'win' ? h.guesses : 99;
    const sorted = history.slice().sort((a, b) => {
      const s = score(a) - score(b);
      if(s !== 0) return s;
      return (a.durationMs ?? Infinity) - (b.durationMs ?? Infinity);
    });
    const visibleLimit = showAllRows ? sorted.length : HISTORY_LIMIT;
    const ranked = sorted.slice(0, visibleLimit);

    // Pinned "your best" row — shown above the numbered ranking so you
    // don't have to scroll to find yourself.
    const myEntries = sorted.filter(h => h.player === playerName);
    if(myEntries.length){
      const mine = myEntries[0];
      const myRank = sorted.indexOf(mine) + 1;
      const resultLabel = mine.result === 'win' ? mine.guesses + '/6' : 'X/6';
      const durLabel = mine.durationMs != null ? formatDuration(mine.durationMs) : '—';
      pinnedSlot.innerHTML = `
        <div class="pinned-label">Your best · #${myRank} overall</div>
        <li class="history-row mine pinned ${mine.result}">
          <div class="history-row-main">
            <span class="history-time">★ ${(mine.player || 'Player').slice(0, 16)}</span>
            <span class="history-word">${mine.word.toUpperCase()}</span>
            <span class="history-result">${resultLabel} · ${durLabel}</span>
          </div>
          <div class="history-when" data-at="${mine.at}">${formatRelativeTime(mine.at)}</div>
        </li>`;
    } else {
      pinnedSlot.innerHTML = '';
    }

    const rankedKey = (showAllRows ? 'all:' : 'top:') + ranked.map(e => e._id || e.at).join(',');
    if(rankedKey === historyRenderKey){
      refreshRelativeTimes();
    } else {
      historyRenderKey = rankedKey;
      historyList.innerHTML = '';
      ranked.forEach((entry, i) => {
        const li = document.createElement('li');
        const isMine = entry.player === playerName;
        li.className = 'history-row ' + entry.result + rankClass(i) + (isMine ? ' mine' : '');
        const resultLabel = entry.result === 'win' ? entry.guesses + '/6' : 'X/6';
        const durLabel = entry.durationMs != null ? formatDuration(entry.durationMs) : '—';
        li.innerHTML = `
          <div class="history-row-main">
            <span class="history-time">${rankBadge(i)} · ${(entry.player || 'Player').slice(0, 16)}</span>
            <span class="history-word">${entry.word.toUpperCase()}</span>
            <span class="history-result">${resultLabel} · ${durLabel}</span>
          </div>
          <div class="history-when" data-at="${entry.at}">${formatRelativeTime(entry.at)}</div>`;
        historyList.appendChild(li);
      });
    }

    showMoreBtn.hidden = sorted.length <= HISTORY_LIMIT;
    showMoreBtn.textContent = showAllRows ? 'Show top 10' : `Show all (${sorted.length})`;
  }

  // --- game setup ---

  function buildBoard(){
    boardEl.innerHTML = '';
    rows = [];
    for(let r = 0; r < MAX_GUESSES; r++){
      const rowEl = document.createElement('div');
      rowEl.className = 'board-row';
      const tiles = [];
      for(let c = 0; c < WORD_LEN; c++){
        const tile = document.createElement('div');
        tile.className = 'tile';
        rowEl.appendChild(tile);
        tiles.push(tile);
      }
      boardEl.appendChild(rowEl);
      rows.push(tiles);
    }
  }

  function buildKeyboard(){
    keyboardEl.innerHTML = '';
    KEY_ROWS.forEach(rowKeys => {
      const rowEl = document.createElement('div');
      rowEl.className = 'key-row';
      rowKeys.forEach(k => {
        const btn = document.createElement('button');
        btn.className = 'key' + (k === 'enter' || k === 'back' ? ' wide' : '');
        btn.dataset.key = k;
        btn.textContent = k === 'enter' ? 'ENTER' : (k === 'back' ? 'DEL' : k);
        btn.addEventListener('click', () => onKey(k));
        rowEl.appendChild(btn);
      });
      keyboardEl.appendChild(rowEl);
    });
  }

  function startRound(){
    answer = WORDS[Math.floor(Math.random() * WORDS.length)];
    currentRow = 0;
    currentGuess = '';
    gameOver = false;
    keyStates = {};
    messageEl.textContent = '';
    endOverlay.classList.add('hidden');
    buildBoard();
    updateKeyboardColors();
    startTimer();
  }

  function showMessage(text){
    messageEl.textContent = text;
  }

  function updateTilesForRow(rowIndex, guess){
    const tiles = rows[rowIndex];
    for(let i = 0; i < WORD_LEN; i++){
      tiles[i].textContent = guess[i] || '';
      tiles[i].classList.toggle('filled', !!guess[i]);
    }
  }

  function evaluateGuess(guess){
    const result = new Array(WORD_LEN).fill('absent');
    const answerChars = answer.split('');
    const guessChars = guess.split('');
    const used = new Array(WORD_LEN).fill(false);

    for(let i = 0; i < WORD_LEN; i++){
      if(guessChars[i] === answerChars[i]){
        result[i] = 'correct';
        used[i] = true;
      }
    }
    for(let i = 0; i < WORD_LEN; i++){
      if(result[i] === 'correct') continue;
      const idx = answerChars.findIndex((ch, j) => ch === guessChars[i] && !used[j]);
      if(idx !== -1){
        result[i] = 'present';
        used[idx] = true;
      }
    }
    return result;
  }

  function updateKeyboardColors(){
    document.querySelectorAll('.key').forEach(btn => {
      const k = btn.dataset.key;
      btn.classList.remove('correct', 'present', 'absent');
      const state = keyStates[k];
      if(state) btn.classList.add(state);
    });
  }

  const RANK = { absent: 0, present: 1, correct: 2 };

  async function submitGuess(){
    if(currentGuess.length !== WORD_LEN){
      showMessage('Not enough letters');
      shakeRow(currentRow);
      return;
    }
    if(!WORD_SET.has(currentGuess)){
      showMessage('Not in word list');
      shakeRow(currentRow);
      return;
    }

    const result = evaluateGuess(currentGuess);
    const tiles = rows[currentRow];

    result.forEach((state, i) => {
      const k = currentGuess[i];
      if(!keyStates[k] || RANK[state] > RANK[keyStates[k]]){
        keyStates[k] = state;
      }
      setTimeout(() => {
        tiles[i].classList.add('reveal', state);
      }, i * 150);
    });
    updateKeyboardColors();
    showMessage('');

    const won = currentGuess === answer;
    const isLastRow = currentRow === MAX_GUESSES - 1;

    setTimeout(async () => {
      if(won){
        await finishRound('win', currentRow + 1);
      } else if(isLastRow){
        await finishRound('lose', MAX_GUESSES);
      } else {
        currentRow++;
        currentGuess = '';
      }
    }, WORD_LEN * 150 + 200);
  }

  async function finishRound(result, guesses){
    gameOver = true;
    stopTimer();
    elapsedMs = Date.now() - roundStartTime;
    liveTimeEl.textContent = formatDuration(elapsedMs);

    const entry = { at: new Date().toISOString(), word: answer, result, guesses, durationMs: elapsedMs };
    await postScore(entry);
    // history/renderHistory/renderStats refresh automatically via the
    // Firestore onSnapshot listener once this write lands.

    if(result === 'win'){
      endTitle.textContent = 'YOU WIN';
      endTitle.className = 'win';
      endSub.textContent = 'Solved in ' + guesses + ' / ' + MAX_GUESSES + ' guesses, ' + formatDuration(elapsedMs) + '.';
      answerWordEl.textContent = '';
    } else {
      endTitle.textContent = 'OUT OF GUESSES';
      endTitle.className = 'lose';
      endSub.textContent = 'The word was:';
      answerWordEl.textContent = answer.toUpperCase();
    }
    setTimeout(() => endOverlay.classList.remove('hidden'), 300);
  }

  function shakeRow(rowIndex){
    const tiles = rows[rowIndex];
    tiles.forEach(t => {
      t.classList.remove('shake');
      void t.offsetWidth;
      t.classList.add('shake');
    });
    setTimeout(() => showMessage(''), 1200);
  }

  function onKey(k){
    if(gameOver) return;
    if(k === 'enter'){
      submitGuess();
      return;
    }
    if(k === 'back'){
      currentGuess = currentGuess.slice(0, -1);
      updateTilesForRow(currentRow, currentGuess);
      return;
    }
    if(/^[a-z]$/.test(k) && currentGuess.length < WORD_LEN){
      currentGuess += k;
      updateTilesForRow(currentRow, currentGuess);
      const tile = rows[currentRow][currentGuess.length - 1];
      tile.classList.remove('pop');
      void tile.offsetWidth;
      tile.classList.add('pop');
    }
  }

  document.addEventListener('keydown', (e) => {
    if(gameOver) return;
    const key = e.key.toLowerCase();
    if(key === 'enter'){ e.preventDefault(); onKey('enter'); }
    else if(key === 'backspace'){ e.preventDefault(); onKey('back'); }
    else if(/^[a-z]$/.test(key)){ onKey(key); }
  });

  nextBtn.addEventListener('click', startRound);
  resetBtn.addEventListener('click', startRound);
  changeNameBtn.addEventListener('click', () => {
    const chosen = window.prompt('Pick a new name for the leaderboard:', playerName);
    if(chosen && chosen.trim()){
      playerName = setPlayerName(chosen);
      playerNameDisplayEl.textContent = playerName;
      renderHistory();
      renderStats();
    }
  });

  (function init(){
    playerName = ensurePlayerName();
    playerNameDisplayEl.textContent = playerName;
    buildKeyboard();
    attachLeaderboardListener();
    startRound();
  })();
})();
</script>
