<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRID // XO — Tic-Tac-Toe</title>
<style>
  :root{
    --bg: #f3f5fb;
    --panel: #ffffff;
    --line: #e2e5f0;
    --line-strong: #cfd3e4;
    --cyan: #e0189e;
    --magenta: #e0189e;
    --amber: #e0189e;
    --text: #1f2333;
    --text-dim: #7d8199;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', 'Consolas', monospace;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 24px 16px;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(224,24,158,0.07), transparent 60%),
      radial-gradient(ellipse at 100% 110%, rgba(224,24,158,0.06), transparent 60%),
      var(--bg);
  }

  .cabinet{
    width: min(640px, 92vw);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 28px;
    position: relative;
    box-shadow: 0 10px 30px rgba(31,35,51,0.06);
  }

  @media (min-width: 640px){
    .cell{ font-size: clamp(36px, 8vw, 56px); }
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .brand{
    font-family: 'Press Start 2P', 'Courier New', monospace;
    font-size: 14px;
    letter-spacing: 2px;
    line-height: 1.6;
  }
  .brand .grid{ color: var(--cyan); }
  .brand .slash{ color: var(--text-dim); }
  .brand .xo{ color: var(--magenta); }

  .back-link{
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    text-decoration: none;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .back-link:hover{ color: var(--cyan); }

  .tag{
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  .mode-row{
    display:flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .mode-btn{
    flex: 1;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
    padding: 9px 6px;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--line);
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.15s ease;
  }
  .mode-btn.active{
    color: var(--cyan);
    border-color: var(--cyan);
    background: rgba(224,24,158,0.08);
  }
  .mode-btn:focus-visible{ outline: 2px solid var(--cyan); outline-offset: 2px; }

  .stat-row{
    display:flex;
    justify-content: space-between;
    margin-bottom: 16px;
    font-size: 12px;
    letter-spacing: 1px;
  }
  .stat{ display:flex; flex-direction:column; align-items:center; gap:4px; flex:1; }
  .stat-label{ color: var(--text-dim); font-size: 10px; }
  .stat-value{ font-weight: bold; font-size: 16px; }
  .stat.x .stat-value{ color: var(--cyan); }
  .stat.o .stat-value{ color: var(--magenta); }
  .stat.draw .stat-value{ color: var(--amber); }

  .turn-indicator{
    text-align:center;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-bottom: 14px;
    min-height: 16px;
  }
  .turn-indicator b.x{ color: var(--cyan); }
  .turn-indicator b.o{ color: var(--magenta); }

  .board{
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    aspect-ratio: 1/1;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
  }

  .cell{
    background: #ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(26px, 9vw, 40px);
    cursor: pointer;
    user-select: none;
    position: relative;
  }
  .cell:hover:not(.filled){ background: #fbeefa; }
  .cell:focus-visible{ outline: 2px solid var(--cyan); outline-offset: -3px; }
  .cell.x{ color: var(--cyan); }
  .cell.o{ color: var(--magenta); }
  .cell.win{ background: rgba(224,24,158,0.10); }

  .cell.filled{ cursor: default; }

  .overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 14px;
    background: rgba(255,255,255,0.92);
    text-align:center;
    padding: 20px;
  }
  .overlay.hidden{ display:none; }

  .overlay h1{
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(15px, 5vw, 20px);
    margin: 0;
  }
  .overlay h1.x{ color: var(--cyan); }
  .overlay h1.o{ color: var(--magenta); }
  .overlay h1.draw{ color: var(--amber); }

  .btn{
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    padding: 12px 20px;
    background: var(--amber);
    color: #ffffff;
    border: 1px solid var(--amber);
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: filter 0.15s ease;
  }
  .btn:hover{ filter: brightness(1.08); }
  .btn:focus-visible{ outline: 2px solid var(--cyan); outline-offset: 3px; }

  footer{
    margin-top: 18px;
    display:flex;
    justify-content: space-between;
    align-items:center;
    flex-wrap: wrap;
    gap: 12px;
  }

  .hint{
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
  }

  .reset-link{
    background:none;
    border:none;
    color: var(--text-dim);
    font-family: 'Courier New', monospace;
    font-size: 11px;
    text-decoration: underline;
    cursor: pointer;
    letter-spacing: 0.5px;
    padding: 0;
  }
  .reset-link:hover{ color: var(--text); }

  @media (prefers-reduced-motion: reduce){
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="cabinet">
  <header>
    <div>
      <a class="back-link" href="index.html">← MENU</a>
      <div class="brand"><span class="grid">GRID</span><span class="slash"> // </span><span class="xo">XO</span></div>
    </div>
    <div class="tag">tic-tac-toe</div>
  </header>

  <div class="mode-row">
    <button class="mode-btn active" id="modeCpu">VS COMPUTER</button>
    <button class="mode-btn" id="mode2p">2 PLAYERS</button>
  </div>

  <div class="stat-row">
    <div class="stat x">
      <span class="stat-label">X WINS</span>
      <span class="stat-value" id="scoreX">0</span>
    </div>
    <div class="stat draw">
      <span class="stat-label">DRAWS</span>
      <span class="stat-value" id="scoreDraw">0</span>
    </div>
    <div class="stat o">
      <span class="stat-label" id="oLabel">O WINS</span>
      <span class="stat-value" id="scoreO">0</span>
    </div>
  </div>

  <div class="turn-indicator" id="turnIndicator">Turn: <b class="x">X</b></div>

  <div class="board" id="board">
    <div class="cell" data-i="0"></div>
    <div class="cell" data-i="1"></div>
    <div class="cell" data-i="2"></div>
    <div class="cell" data-i="3"></div>
    <div class="cell" data-i="4"></div>
    <div class="cell" data-i="5"></div>
    <div class="cell" data-i="6"></div>
    <div class="cell" data-i="7"></div>
    <div class="cell" data-i="8"></div>

    <div class="overlay hidden" id="endOverlay">
      <h1 id="endTitle">DRAW</h1>
      <button class="btn" id="nextBtn">NEXT ROUND</button>
    </div>
  </div>

  <footer>
    <div class="hint">Click a square to place your mark.</div>
    <button class="reset-link" id="resetScores">Reset scores</button>
  </footer>
</div>

<script>
(function(){
  const boardEl = document.getElementById('board');
  const cells = Array.from(document.querySelectorAll('.cell'));
  const endOverlay = document.getElementById('endOverlay');
  const endTitle = document.getElementById('endTitle');
  const nextBtn = document.getElementById('nextBtn');
  const turnIndicator = document.getElementById('turnIndicator');
  const modeCpuBtn = document.getElementById('modeCpu');
  const mode2pBtn = document.getElementById('mode2p');
  const oLabel = document.getElementById('oLabel');
  const scoreXEl = document.getElementById('scoreX');
  const scoreOEl = document.getElementById('scoreO');
  const scoreDrawEl = document.getElementById('scoreDraw');
  const resetScoresBtn = document.getElementById('resetScores');

  const WIN_LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  let board, current, active, vsComputer = true;
  let scores = { X: 0, O: 0, Draw: 0 };

  function init(){
    board = Array(9).fill(null);
    current = 'X';
    active = true;
    endOverlay.classList.add('hidden');
    cells.forEach(c => {
      c.textContent = '';
      c.className = 'cell';
    });
    updateTurnIndicator();
  }

  function updateTurnIndicator(){
    if(!active) return;
    turnIndicator.innerHTML = 'Turn: <b class="' + current.toLowerCase() + '">' + current + '</b>' +
      (vsComputer && current === 'O' ? ' (computer thinking…)' : '');
  }

  function updateScoreboard(){
    scoreXEl.textContent = scores.X;
    scoreOEl.textContent = scores.O;
    scoreDrawEl.textContent = scores.Draw;
  }

  function checkWinner(b){
    for(const line of WIN_LINES){
      const [a,b1,c] = line;
      if(b[a] && b[a] === b[b1] && b[a] === b[c]){
        return { winner: b[a], line };
      }
    }
    if(b.every(v => v !== null)) return { winner: 'Draw', line: null };
    return null;
  }

  function placeMark(i, mark){
    board[i] = mark;
    const cell = cells[i];
    cell.textContent = mark;
    cell.classList.add('filled', mark.toLowerCase());
  }

  function endRound(result){
    active = false;
    if(result.winner === 'Draw'){
      scores.Draw++;
      endTitle.textContent = 'DRAW';
      endTitle.className = 'draw';
    } else {
      scores[result.winner]++;
      endTitle.textContent = result.winner + ' WINS';
      endTitle.className = result.winner.toLowerCase();
      result.line.forEach(idx => cells[idx].classList.add('win'));
    }
    updateScoreboard();
    turnIndicator.textContent = '';
    setTimeout(() => endOverlay.classList.remove('hidden'), 400);
  }

  function handleMove(i){
    if(!active || board[i]) return;
    placeMark(i, current);
    const result = checkWinner(board);
    if(result){
      endRound(result);
      return;
    }
    current = current === 'X' ? 'O' : 'X';
    updateTurnIndicator();

    if(vsComputer && current === 'O' && active){
      setTimeout(computerMove, 400);
    }
  }

  function computerMove(){
    if(!active) return;
    const move = pickComputerMove();
    if(move !== undefined) handleMove(move);
  }

  // simple heuristic AI: win > block > center > corner > random
  function pickComputerMove(){
    const empties = board.map((v,i) => v === null ? i : null).filter(v => v !== null);

    for(const i of empties){
      const copy = board.slice(); copy[i] = 'O';
      if(checkWinner(copy)?.winner === 'O') return i;
    }
    for(const i of empties){
      const copy = board.slice(); copy[i] = 'X';
      if(checkWinner(copy)?.winner === 'X') return i;
    }
    if(board[4] === null) return 4;
    const corners = [0,2,6,8].filter(i => board[i] === null);
    if(corners.length) return corners[Math.floor(Math.random()*corners.length)];
    return empties[Math.floor(Math.random()*empties.length)];
  }

  boardEl.addEventListener('click', (e) => {
    const cell = e.target.closest('.cell');
    if(!cell) return;
    const i = Number(cell.dataset.i);
    if(vsComputer && current === 'O') return; // ignore clicks during computer turn
    handleMove(i);
  });

  nextBtn.addEventListener('click', init);

  modeCpuBtn.addEventListener('click', () => {
    vsComputer = true;
    modeCpuBtn.classList.add('active');
    mode2pBtn.classList.remove('active');
    oLabel.textContent = 'CPU WINS';
    resetScoresBtn.click();
  });

  mode2pBtn.addEventListener('click', () => {
    vsComputer = false;
    mode2pBtn.classList.add('active');
    modeCpuBtn.classList.remove('active');
    oLabel.textContent = 'O WINS';
    resetScoresBtn.click();
  });

  resetScoresBtn.addEventListener('click', () => {
    scores = { X: 0, O: 0, Draw: 0 };
    updateScoreboard();
    init();
  });

  init();
})();
</script>

</body>
</html>
