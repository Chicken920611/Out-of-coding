<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRID // MATCH — Memory</title>
<style>
  :root{
    --bg: #f3f5fb;
    --panel: #ffffff;
    --line: #e2e5f0;
    --line-strong: #cfd3e4;
    --cyan: #ff6a00;
    --magenta: #ff6a00;
    --amber: #ff6a00;
    --text: #1f2333;
    --text-dim: #7d8199;
    --success: #16a34a;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', 'Consolas', monospace;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 24px 16px;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(255,106,0,0.07), transparent 60%),
      radial-gradient(ellipse at 100% 110%, rgba(255,106,0,0.06), transparent 60%),
      var(--bg);
  }

  .cabinet{
    width: min(1000px, 94vw);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 28px;
    position: relative;
    box-shadow: 0 10px 30px rgba(31,35,51,0.06);
  }

  .layout{
    display: flex;
    flex-direction: column;
  }

  .main-col{ min-width: 0; }
  .side-col{ min-width: 0; }

  @media (min-width: 820px){
    .layout{
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 36px;
      align-items: start;
    }
    .board{ max-width: 420px; margin: 0 auto; }
    .card-face{ font-size: clamp(24px, 3vw, 36px); }
    .history{ margin-top: 0; border-top: none; padding-top: 0; }
    .history-list{ max-height: 460px; }
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .back-link{
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    text-decoration: none;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .back-link:hover{ color: var(--cyan); }

  .brand{
    font-family: 'Press Start 2P', 'Courier New', monospace;
    font-size: 14px;
    letter-spacing: 2px;
    line-height: 1.6;
  }
  .brand .grid{ color: var(--cyan); }
  .brand .slash{ color: var(--text-dim); }
  .brand .match{ color: var(--amber); }

  .tag{
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  .stat-row{
    display:flex;
    justify-content: space-between;
    margin-bottom: 18px;
    font-size: 12px;
    letter-spacing: 1px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 8px;
  }
  .stat{ display:flex; flex-direction:column; align-items:center; gap:4px; flex:1; }
  .stat-label{ color: var(--text-dim); font-size: 10px; }
  .stat-value{ font-weight: bold; font-size: 16px; color: var(--amber); }

  .history{
    margin-top: 22px;
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }
  .history-head{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .history-title{
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--text-dim);
  }
  .player-badge{
    font-size: 11px;
    color: var(--text-dim);
  }
  .player-badge b{ color: var(--text); }
  .history-list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap: 6px;
    max-height: 168px;
    overflow-y: auto;
  }
  .history-row{
    display:flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 11px;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .history-row.best{
    border-color: var(--success);
    background: #f0fdf4;
  }
  .history-row.mine .history-time{ color: var(--cyan); font-weight: bold; }
  .history-time{ color: var(--text-dim); }
  .history-mid{ color: var(--text); }
  .history-dur{ color: var(--cyan); font-weight: bold; }
  .history-empty{
    font-size: 11px;
    color: var(--text-dim);
    padding: 10px 2px;
  }

  .stage{
    position: relative;
  }

  .board{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .card{
    aspect-ratio: 1/1;
    position: relative;
    cursor: pointer;
    perspective: 600px;
  }

  .card-inner{
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.35s ease;
  }
  .card.flipped .card-inner,
  .card.matched .card-inner{
    transform: rotateY(180deg);
  }

  .card-face{
    position: absolute;
    inset: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius: 8px;
    backface-visibility: hidden;
    font-size: clamp(22px, 7vw, 34px);
  }
  .card-back{
    background: #eef0f8;
    border: 2px solid var(--line-strong);
    color: var(--text-dim);
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
  }
  .card-back:hover{
    border-color: var(--cyan);
    background: #e7fbf9;
  }
  .card-front{
    background: var(--tile-bg, #ffffff);
    border: 2px solid var(--tile-color, var(--cyan));
    transform: rotateY(180deg);
    box-shadow: 0 2px 8px rgba(31,35,51,0.06);
  }
  .card.matched .card-front{
    border-color: var(--success);
    background: #f0fdf4;
    box-shadow: 0 0 0 3px rgba(22,163,74,0.12);
  }

  .card:focus-visible .card-back,
  .card:focus-visible .card-front{ outline: 2px solid var(--cyan); outline-offset: 2px; }

  .overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 14px;
    background: rgba(255,255,255,0.94);
    text-align:center;
    padding: 20px;
    border-radius: 10px;
    backdrop-filter: blur(2px);
  }
  .overlay.hidden{ display:none; }

  .overlay h1{
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(14px, 4.5vw, 18px);
    margin: 0;
    color: var(--success);
  }
  .overlay p{
    margin:0;
    font-size: 12px;
    color: var(--text-dim);
  }

  .btn{
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    padding: 12px 20px;
    background: var(--amber);
    color: #ffffff;
    border: 1px solid var(--amber);
    cursor: pointer;
    letter-spacing: 1px;
    border-radius: 6px;
    transition: filter 0.15s ease;
  }
  .btn:hover{ filter: brightness(1.08); }
  .btn:focus-visible{ outline: 2px solid var(--cyan); outline-offset: 3px; }

  footer{
    margin-top: 18px;
    display:flex;
    justify-content: space-between;
    align-items:center;
    flex-wrap: wrap;
    gap: 12px;
  }

  .hint{
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
  }

  .reset-link{
    background:none;
    border:none;
    color: var(--text-dim);
    font-family: 'Courier New', monospace;
    font-size: 11px;
    text-decoration: underline;
    cursor: pointer;
    letter-spacing: 0.5px;
    padding: 0;
  }
  .reset-link:hover{ color: var(--text); }

  @media (prefers-reduced-motion: reduce){
    .card-inner{ transition: none; }
  }
</style>
</head>
<body>

<div class="cabinet">
  <header>
    <div>
      <a class="back-link" href="index.html">← MENU</a>
      <div class="brand"><span class="grid">GRID</span><span class="slash"> // </span><span class="match">MATCH</span></div>
    </div>
    <div class="tag">memory pairs</div>
  </header>

  <div class="layout">
    <div class="main-col">
      <div class="stat-row">
        <div class="stat">
          <span class="stat-label">MOVES</span>
          <span class="stat-value" id="moves">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">PAIRS</span>
          <span class="stat-value" id="pairs">0 / 8</span>
        </div>
        <div class="stat">
          <span class="stat-label">TIME</span>
          <span class="stat-value" id="time">0:00</span>
        </div>
        <div class="stat">
          <span class="stat-label">BEST</span>
          <span class="stat-value" id="best">—</span>
        </div>
      </div>

      <div class="stage">
        <div class="board" id="board"></div>

        <div class="overlay hidden" id="endOverlay">
          <h1>ALL MATCHED</h1>
          <p id="endText">Cleared in 0 moves.</p>
          <button class="btn" id="nextBtn">PLAY AGAIN</button>
        </div>
      </div>

      <footer>
        <div class="hint">Flip two cards to find a pair.</div>
        <button class="reset-link" id="resetBtn">Restart</button>
      </footer>
    </div>

    <div class="side-col">
      <div class="history">
        <div class="history-head">
          <span class="history-title">TOP RUNS</span>
          <span class="player-badge">Playing as <b id="playerNameDisplay">—</b> · <button class="reset-link" id="changeNameBtn">change</button></span>
        </div>
        <ul class="history-list" id="historyList"></ul>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="player-name.js"></script>
<script>
(function(){
  const boardEl = document.getElementById('board');
  const movesEl = document.getElementById('moves');
  const pairsEl = document.getElementById('pairs');
  const timeEl = document.getElementById('time');
  const bestEl = document.getElementById('best');
  const endOverlay = document.getElementById('endOverlay');
  const endText = document.getElementById('endText');
  const nextBtn = document.getElementById('nextBtn');
  const resetBtn = document.getElementById('resetBtn');
  const historyList = document.getElementById('historyList');
  const playerNameDisplayEl = document.getElementById('playerNameDisplay');
  const changeNameBtn = document.getElementById('changeNameBtn');

  // Each icon carries its own hue so pairs are distinguishable by both
  // shape AND color — helps at a glance and for anyone who finds
  // similar glyphs hard to tell apart.
  const SYMBOLS = [
    { sym: '🍎', color: '#e5484d', bg: '#fdecec' }, // apple — red
    { sym: '🍋', color: '#e6a700', bg: '#fdf6dc' }, // lemon — yellow
    { sym: '🍇', color: '#8e4ec6', bg: '#f3ebfb' }, // grapes — purple
    { sym: '🍊', color: '#f0740b', bg: '#fdedde' }, // orange — orange
    { sym: '🍉', color: '#1a9e5c', bg: '#e6f7ee' }, // watermelon — green
    { sym: '🫐', color: '#3b5bdb', bg: '#e8ecfc' }, // blueberry — blue
    { sym: '🍓', color: '#e0218a', bg: '#fbe6f2' }, // strawberry — magenta
    { sym: '🥥', color: '#8a5a34', bg: '#f3e9de' }, // coconut — brown
  ];

  const COLLECTION = 'memory_scores';
  const HISTORY_LIMIT = 10;

  let cards, flipped, matchedCount, moves, locked;
  let startTime, elapsedMs, timerHandle;
  let history = [];
  let playerName = 'Player';

  // --- shared leaderboard (Firestore) ---
  // Scores post to a shared collection everyone reads from, so the
  // leaderboard updates live across every visitor's browser. See
  // firestore.rules: writes are create-only (no edit/delete), so there's
  // no "clear history" here anymore — it's an append-only shared board.

  function attachLeaderboardListener(){
    db.collection(COLLECTION)
      .orderBy('at', 'desc')
      .limit(200)
      .onSnapshot(snapshot => {
        history = snapshot.docs.map(doc => doc.data());
        renderHistory();
        updateHud();
      }, err => {
        console.error('Leaderboard sync error:', err);
        historyList.innerHTML = '<li class="history-empty">Couldn\'t reach the leaderboard — check firebase-config.js.</li>';
      });
  }

  async function postScore(entry){
    try{
      await db.collection(COLLECTION).add({ ...entry, player: playerName });
    } catch(err){
      console.error('Failed to post score:', err);
    }
  }

  function formatDuration(ms){
    const totalSec = Math.floor(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  function formatTimestamp(iso){
    const d = new Date(iso);
    return d.toLocaleString(undefined, {
      month: 'short', day: 'numeric',
      hour: 'numeric', minute: '2-digit'
    });
  }

  function bestMoves(){
    const mine = history.filter(h => h.player === playerName);
    if(mine.length === 0) return null;
    return Math.min(...mine.map(h => h.moves));
  }

  function renderHistory(){
    historyList.innerHTML = '';
    if(history.length === 0){
      const empty = document.createElement('li');
      empty.className = 'history-empty';
      empty.textContent = 'No completed runs yet — finish a board to log one.';
      historyList.appendChild(empty);
      return;
    }
    // Rank best-to-worst: fewest moves first, faster time breaks ties.
    // Sorts a copy — the underlying history array stays in chronological
    // order since other stats (like BEST) are computed from it directly.
    const ranked = history.slice().sort((a, b) => {
      if(a.moves !== b.moves) return a.moves - b.moves;
      return a.durationMs - b.durationMs;
    }).slice(0, HISTORY_LIMIT);

    ranked.forEach((entry, i) => {
      const li = document.createElement('li');
      const isMine = entry.player === playerName;
      li.className = 'history-row' + (i === 0 ? ' best' : '') + (isMine ? ' mine' : '');
      li.innerHTML = `
        <span class="history-time">#${i + 1} · ${(entry.player || 'Player').slice(0, 16)}</span>
        <span class="history-mid">${entry.moves} moves</span>
        <span class="history-dur">${formatDuration(entry.durationMs)}</span>`;
      historyList.appendChild(li);
    });
  }

  // --- timer ---

  function startTimer(){
    stopTimer();
    startTime = Date.now();
    elapsedMs = 0;
    timerHandle = setInterval(() => {
      elapsedMs = Date.now() - startTime;
      timeEl.textContent = formatDuration(elapsedMs);
    }, 250);
  }

  function stopTimer(){
    if(timerHandle) clearInterval(timerHandle);
    timerHandle = null;
  }

  // --- game ---

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildBoard(){
    boardEl.innerHTML = '';
    const deck = shuffle([...SYMBOLS, ...SYMBOLS]);
    cards = deck.map((icon, i) => ({ id: i, ...icon, matched: false }));
    flipped = [];
    matchedCount = 0;
    moves = 0;
    locked = false;
    elapsedMs = 0;
    stopTimer();
    timeEl.textContent = '0:00';
    endOverlay.classList.add('hidden');
    updateHud();

    cards.forEach(card => {
      const el = document.createElement('div');
      el.className = 'card';
      el.dataset.id = card.id;
      el.tabIndex = 0;
      el.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-back">?</div>
          <div class="card-face card-front" style="--tile-color:${card.color}; --tile-bg:${card.bg};">${card.sym}</div>
        </div>`;
      el.addEventListener('click', () => handleFlip(card.id, el));
      el.addEventListener('keydown', (e) => {
        if(e.code === 'Enter' || e.code === 'Space'){
          e.preventDefault();
          handleFlip(card.id, el);
        }
      });
      boardEl.appendChild(el);
    });
  }

  function updateHud(){
    movesEl.textContent = moves;
    pairsEl.textContent = matchedCount + ' / ' + SYMBOLS.length;
    const min = bestMoves();
    bestEl.textContent = min === null ? '—' : min;
  }

  function handleFlip(id, el){
    if(locked) return;
    if(el.classList.contains('flipped') || el.classList.contains('matched')) return;
    if(flipped.length === 2) return;

    if(moves === 0 && flipped.length === 0 && matchedCount === 0 && !timerHandle){
      startTimer();
    }

    el.classList.add('flipped');
    flipped.push({ id, el });

    if(flipped.length === 2){
      moves++;
      updateHud();
      const [a, b] = flipped;
      const cardA = cards.find(c => c.id === a.id);
      const cardB = cards.find(c => c.id === b.id);

      if(cardA.sym === cardB.sym){
        a.el.classList.add('matched');
        b.el.classList.add('matched');
        cardA.matched = true;
        cardB.matched = true;
        matchedCount++;
        flipped = [];
        updateHud();
        if(matchedCount === SYMBOLS.length){
          finishGame();
        }
      } else {
        locked = true;
        setTimeout(() => {
          a.el.classList.remove('flipped');
          b.el.classList.remove('flipped');
          flipped = [];
          locked = false;
        }, 700);
      }
    }
  }

  async function finishGame(){
    stopTimer();
    elapsedMs = Date.now() - startTime;
    timeEl.textContent = formatDuration(elapsedMs);

    const prevBest = bestMoves();
    const entry = { at: new Date().toISOString(), moves, durationMs: elapsedMs };
    await postScore(entry);
    // history/renderHistory/updateHud refresh automatically via the
    // Firestore onSnapshot listener once this write lands.

    const isNewBest = prevBest === null || moves < prevBest;
    endText.textContent = 'Cleared in ' + moves + ' moves, ' + formatDuration(elapsedMs) + '.' + (isNewBest ? ' New best!' : '');
    setTimeout(() => endOverlay.classList.remove('hidden'), 400);
  }

  nextBtn.addEventListener('click', buildBoard);
  resetBtn.addEventListener('click', buildBoard);
  changeNameBtn.addEventListener('click', () => {
    const chosen = window.prompt('Pick a new name for the leaderboard:', playerName);
    if(chosen && chosen.trim()){
      playerName = setPlayerName(chosen);
      playerNameDisplayEl.textContent = playerName;
      renderHistory();
      updateHud();
    }
  });

  (function init(){
    playerName = ensurePlayerName();
    playerNameDisplayEl.textContent = playerName;
    attachLeaderboardListener();
    buildBoard();
  })();
})();
</script>

</body>
</html>
